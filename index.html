<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
    <style>
        /* Reseta margens e espaçamentos padrão */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Primeira Seção: Faixa do topo */
        .top-bar {
            width: 100%;
            height: 65px;
            background-color: #1a1a1a; /* Cor de fundo da faixa */
            display: flex;
            align-items: center;       /* Centraliza a logo na vertical */
            padding: 0 20px;          /* Espaço nas laterais */
        }

        /* Configuração da imagem da Logo */
        .logo img {
            height: 50px;             /* Ajuste a altura desejada */
            width: auto;
            display: block;
        }
    </style>
</head>
<body>

    <!-- PRIMEIRA SEÇÃO: FAIXA DO TOPO (HEADER) -->
    <header class="top-bar">
        <div class="logo">
            <img src="logo.png" alt="Logo da Empresa">
        </div>
    </header>

</body>
</html>
